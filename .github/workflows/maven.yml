name: Build SF_Magic8Ball

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_new_release:
        description: 'Publish a DISTINCT version only after all release gates pass'
        type: boolean
        required: true
        default: false
      expected_source_sha:
        description: 'Exact reviewed 40-character source commit SHA of selected tag'
        type: string
        required: false

permissions:
  contents: write

env:
  ARTIFACT_VERSION: "1.0.2"
  OUTPUT_NAME: "SF_Magic8Ball1.0.2.jar"
  MAIN_CLASS: "com.xmooncorp.magic8ball.Magic8Ball"
  SLIMEFUN_LEGACY_VERSION: "4.1.48"

concurrency:
  group: sf-magic8ball-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install Slimefun Legacy locally
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .deps
          gh release download "v${SLIMEFUN_LEGACY_VERSION}" --repo wickidcow/Slimefun-Legacy --pattern "Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar" --dir .deps
          mvn -B install:install-file -Dfile=".deps/Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar" -DgroupId=com.github.slimefun -DartifactId=Slimefun -Dversion="${SLIMEFUN_LEGACY_VERSION}" -Dpackaging=jar -DgeneratePom=true
      - name: Test immutable release authorization and non-destructive behavior
        shell: bash
        run: |
          bash -n scripts/publish_new_release.sh
          python3 -m unittest discover -s scripts -p 'test_publish_new_release.py' -v
      - name: Verify preservation modernization
        run: |
          set -euo pipefail
          grep -Fq '<version>1.0.2</version>' pom.xml
          grep -Fq '<paper.version>1.21.11-R0.1-SNAPSHOT</paper.version>' pom.xml
          grep -Fq 'cooldown-ms: 500' src/main/resources/config.yml
          grep -Fq 'player.sendActionBar' src/main/java/com/xmooncorp/magic8ball/implementation/items/Magic8BallItem.java
          grep -Fq 'FALLBACK' src/main/java/com/xmooncorp/magic8ball/implementation/items/Magic8BallItem.java
      - name: Verify Paper 1.21.11 baseline
        run: >-
          mvn -B -Dmaven.test.skip=true clean package
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version="${SLIMEFUN_LEGACY_VERSION}"
      - name: Verify Paper 26.2 primary compatibility
        run: >-
          mvn -B -Dmaven.test.skip=true clean package
          -Dpaper.version=26.2.build.112-stable
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version="${SLIMEFUN_LEGACY_VERSION}"
      - name: Verify Paper 26.3 alpha compatibility
        run: >-
          mvn -B -Dmaven.test.skip=true clean package
          -Dpaper.version=26.3-rc-3.build.1-alpha
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version="${SLIMEFUN_LEGACY_VERSION}"
      - name: Build universal release JAR from 1.21.11 baseline
        run: >-
          mvn -B -Dmaven.test.skip=true clean package
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version="${SLIMEFUN_LEGACY_VERSION}"
      - name: Validate JAR
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${OUTPUT_NAME}" "dist/${OUTPUT_NAME}"
          JAR="dist/${OUTPUT_NAME}"
          unzip -tqq "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Fq "version: ${ARTIFACT_VERSION}"
          unzip -p "$JAR" config.yml | grep -Fq 'cooldown-ms: 500'
          javap -verbose -classpath "$JAR" "$MAIN_CLASS" | grep -Fq 'major version: 65'
          ! jar tf "$JAR" | grep -q '^io/github/thebusybiscuit/slimefun4/'
          ! jar tf "$JAR" | grep -Eqi '(^|/)net/guizhanss/guizhanlib|(^|/)guizhanlib'
          sha256sum "$JAR"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      # Normal main/tag builds are BUILD-ONLY and must never touch existing assets.
      - name: Publish a distinct, reviewed version only on explicit tag dispatch
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && inputs.publish_new_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CONFIRMED: ${{ inputs.publish_new_release }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        shell: bash
        run: bash scripts/publish_new_release.sh
